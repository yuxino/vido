<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vido 2 browser regression</title><link rel="stylesheet" href="../dist/vido.css"><style>body{font:15px/1.6 system-ui;margin:32px;max-width:800px}#fixture{max-width:640px}li{margin:6px 0}</style><h1>Vido 2 browser regression</h1><p id="summary">Running…</p><ol id="results"></ol><div id="fixture"></div><script type="module">
import Vido from '../dist/vido.js';
let passed=0, failed=0;
const check=(name,fn)=>{const li=document.createElement('li');try{fn();passed++;li.textContent='PASS · '+name}catch(e){failed++;li.textContent='FAIL · '+name+': '+e.message}document.querySelector('#results').append(li)};
const assert=(ok)=>{if(!ok)throw new Error('assertion failed')};
const el=document.querySelector('#fixture');el.innerHTML='<p>Preserve me</p><video controls preload="none"><source src="" type="video/mp4"></video>';
const video=el.querySelector('video'), source=video.querySelector('source');
const player=new Vido({el,video,lang:'en'});
check('Native video and source nodes preserved',()=>assert(player.video===video&&video.querySelector('source')===source));
check('Controls replace native controls only after enhancement',()=>assert(!video.controls&&el.querySelector('[data-vido-control="play"]')));
check('Unknown duration disables seek',()=>assert(el.querySelector('[data-vido-control="seek"]').disabled));
check('Avatar uses an SVG image URL',()=>{player.setTheme({avatar:'../docs/vido-avatar.png',motion:false});assert(el.querySelector('svg image').getAttribute('href').endsWith('/docs/vido-avatar.png'));assert(el.dataset.vidoMotion==='false')});
check('Script URL cannot become avatar',()=>{player.setTheme({avatar:'javascript:alert(1)'});assert(el.querySelector('svg image').getAttribute('href')==='')});
check('Double mount is rejected',()=>{let rejected=false;try{new Vido({el})}catch{rejected=true}assert(rejected)});
check('Destroy restores usable native controls, position and class',()=>{player.destroy();assert(video.controls&&video.parentElement===el&&!el.classList.contains('vido')&&!el.querySelector('.vido-shell')&&el.firstElementChild.textContent==='Preserve me')});
check('Destroy is idempotent and remount works',()=>{player.destroy();const next=new Vido({el,video});next.destroy();assert(video.controls)});
document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed`;document.body.dataset.result=failed?'failed':'passed';window.vidoRegression={passed,failed};
</script></html>
